name: "Pull request"
on:
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.9']
        # Node 20 EOL is April 2026. Testing on 22 (LTS) and 24 (current).
        node-version: ['22', '24']
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          bun-version: ${{ matrix.bun-version }}
          node-version: ${{ matrix.node-version }}
          build-command: bunx nx affected -t build:all --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

      - name: Code quality checks
        run: bunx nx affected -t check --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

        # Detection runs HERE — after setup has already run nx (build) — so
        # the project graph is warm: the same conditions under which the Test
        # step below selects its projects. The old gate ran the same query
        # inside setup-env as the job's FIRST nx invocation, where it silently
        # resolved an empty set while Test still ran the browser suites
        # (#901). Fail-open on anything suspect: an unneeded install costs
        # ~60-90s; a skipped needed install costs the whole run.
      - name: Detect Playwright need
        id: pw
        run: |
          if ! AFFECTED=$(bunx nx show projects --affected --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD); then
            echo "affected query failed — failing open"; echo "required=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! UNIVERSE=$(bunx nx show projects --projects tag:playwright); then
            echo "tag query failed — failing open"; echo "required=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "affected: $(echo "$AFFECTED" | tr '\n' ' ')"
          echo "tag:playwright universe: $(echo "$UNIVERSE" | tr '\n' ' ')"
          if [ -z "$UNIVERSE" ]; then
            echo "tag universe resolved EMPTY while tagged projects exist in-tree — graph suspect, failing open"
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif NEEDED=$(grep -Fxf <(echo "$UNIVERSE") <(echo "$AFFECTED")); [ -n "$NEEDED" ]; then
            echo "browser suites affected: $(echo "$NEEDED" | tr '\n' ' ')"
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "no browser suite affected — skipping browser install"
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: ${{ steps.pw.outputs.required == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        env:
          INSTALL_PLAYWRIGHT: ${{ steps.pw.outputs.required }}
        run: bash .github/actions/setup-env/install-playwright.sh

      - name: Test
        run: bunx nx affected -t test --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

    # The implementation graph data (data/*.ttl) is committed and must match
    # what the collector generates from the @implements annotations in-tree.
  implementation-data:
    name: Implementation graph freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          # The collector scans sources only; no package build is needed.
          build-command: "echo 'build skipped: not needed to collect implementations'"

      - name: Check implementation graph data is up to date
        run: bun run collect:check

    # A workspace package must never declare a range on a workspace sibling
    # that the sibling's current version cannot satisfy: Bun then declines to
    # link the in-tree copy and silently substitutes a published one from the
    # registry, and the build dies far from the cause (v0.35.0 bump, 5198c5399).
    #
    # This is a sibling of `implementation-data` rather than a step inside it,
    # for two reasons. It reads package.json manifests and nothing else — no
    # install, no node_modules, no build — so bolting it onto a job that first
    # spends ~60-90s in `bun install` would delay the repo's cheapest signal
    # and make it contingent on the very dependency resolution this class of
    # bug corrupts. And a failure needs to surface under a check named for what
    # actually broke; reporting a stale range under "Implementation graph
    # freshness" is exactly the 2am misdirection the guard exists to avoid.
    # No new workflow file: it shares pr.yml with the job it is modelled on.
  workspace-ranges:
    name: Workspace sibling version ranges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

        # Runs first: a guard whose failing case no longer fails is worse than
        # no guard, and this suite constructs the exact ^0.34.0-vs-0.35.0 case
        # and asserts it is reported.
      - name: Test the guard
        run: bun run check:ranges:test

      - name: Check workspace sibling version ranges
        run: bun run check:ranges

  build-gate:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ success() }}
    steps:
      - name: All checks passed
        run: echo "All build matrix jobs completed successfully"
