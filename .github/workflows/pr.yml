name: "Pull request"
on:
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.9']
        # Node 20 EOL is April 2026. Testing on 22 (LTS) and 24 (current).
        node-version: ['22', '24']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          bun-version: ${{ matrix.bun-version }}
          node-version: ${{ matrix.node-version }}
          install-playwright: 'true'
          build-command: bunx nx affected -t build:all --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

      - name: Code quality checks
        run: bunx nx affected -t check --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

        # Diagnostic breadcrumb (#901): proves at test time which pr.yml
        # version executed and what browser state setup actually produced —
        # the setup section sits beyond the API's log-tail window, so this
        # prints the decisive facts where the tail always reaches.
      - name: Browser state before tests
        run: |
          echo "this pr.yml passes install-playwright='true' to setup-env"
          ls ~/.cache/ms-playwright/ 2>/dev/null || echo "ms-playwright dir ABSENT"

      - name: Test
        run: bunx nx affected -t test --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

  build-gate:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ success() }}
    steps:
      - name: All checks passed
        run: echo "All build matrix jobs completed successfully"
