# Applies PR linting checks
# This should be separate from the `pr` workflow as we don't need to build/test the code every time PR metadata changes
# Follows https://github.com/amannn/action-semantic-pull-request/blob/40166f00814508ec3201fc8595b393d451c8cd80/README.md
name: "PR Lint"
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  pull-requests: read

jobs:
  validate-pr-metadata:
    name: Validate PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Verify conventional commit-compliant PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The closed type vocabulary. Every entry has a label of the same name,
          # applied by `apply-type-label` below — keep this list in step with
          # `TYPES` in `.github/actions/apply-type-label/apply-type-label.cjs`.
          types: |
            feat
            fix
            docs
            refactor
            chore
            test
            ci
            revert

  apply-type-label:
    name: Apply type label
    needs: validate-pr-metadata
    runs-on: ubuntu-latest
    # ONE run at a time per pull request. Two edits in quick succession queue
    # two runs, and run side by side they can each read the labels before the
    # other writes them: a `feat` → `docs` → `fix` retitle then leaves BOTH
    # `docs` and `fix` behind, each run having removed only the `feat` it saw.
    # A newer run cancels an older one, whether that older run is still queued
    # or already executing. Only the newest run can be right: the label is
    # reconciled from the title read live below, so a run still working on a
    # title that has since been edited is doing work that will be undone.
    # Cancelling has one window — this job adds labels before it removes them,
    # so an interrupted run can leave the old label sitting beside the new one
    # — and the run whose arrival caused the cancellation closes it, because it
    # reconciles the whole managed set against the current title.
    concurrency:
      group: apply-type-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      # A job that declares any permission gets none of the others, so the read
      # the checkout step needs has to be named here explicitly.
      contents: read
      pull-requests: write
      # Creating a managed label that does not exist yet goes through the issues API.
      issues: write
    steps:
      # A local `uses: ./…` action has to be on disk before it can run, and the
      # workspace starts empty. Only the actions tree is needed, so the checkout
      # is shallow and sparse. It lands on the PR's merge commit — the same ref
      # this workflow file itself is read from on a `pull_request` event, so
      # the action is no more trusted than the workflow already was. That
      # equivalence is what `pull_request` buys, and only it: do not move
      # this job to `pull_request_target`, where the same two steps would
      # run a pull request's own code against a writable token.
      - name: Check out the label action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions

      # The title is the source of truth. It has just been validated, so the type
      # label is derived from it rather than applied by hand: `feat(x): …` gets
      # `feat`, and a `!` marker gets `breaking` alongside it. Labels this job
      # manages are also removed when the title stops implying them, so an edited
      # title never leaves a stale type behind.
      - name: Derive the type label from the PR title
        uses: ./.github/actions/apply-type-label
