name: Setup environment
description: Installs build tools, restores caches, starts Nx cache server, and installs dependencies
inputs:
  bun-version:
    default: '1.3.9'
    description: Version of Bun to use
  node-version:
    # Node is required for Storybook and Lerna (Bun is used as package manager only)
    # Storybook 10 supports Node 20.16+, 22.19+, or 24+
    default: '24'
    description: Version of Node to use
  build-command:
    default: 'bunx lerna run build:all'
    description: Build command to run. Override with nx affected for PR workflows.
  install-playwright:
    default: 'false'
    description: >-
      Set 'true' in any job that runs browser tests. Browser install is
      explicit workflow intent: a previous nx-affected gate silently resolved
      empty in CI (exit 0, no output, nothing logged) while the test step's own
      affected calculation still ran the browser suites, so browsers were
      skipped and every browser test died on missing executables (#901). The
      cost of an unconditional install on a test job (~60-90s, cached on
      bun.lock) is not worth that failure class.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache node_modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('bun.lock') }}

    - name: Cache Bun global cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Cache Nx remote cache
      uses: actions/cache@v5
      with:
        path: /tmp/nx-remote-cache
        key: nx-remote-cache-${{ runner.os }}-${{ inputs.node-version }}-${{ github.sha }}

    - name: Install dependencies
      shell: bash
      # NOTE: --frozen-lockfile disabled for now due to a known Bun bug where bun install
      # always writes the lockfile internally, causing false positives with --frozen-lockfile
      # even when bun.lock content is unchanged. Tracked in:
      # https://github.com/oven-sh/bun/issues/16692
      # https://github.com/oven-sh/bun/issues/19088
      # run: bun install --frozen-lockfile
      #
      # --ignore-scripts prevents the "prepare" lifecycle hook from triggering a full
      # monorepo build during install. Workflows that need a build invoke it explicitly.
      run: bun install --ignore-scripts && git diff --exit-code bun.lock

      # Workaround for https://github.com/oven-sh/bun/issues/19782
      # Workspace bin symlinks aren't created on first install. Remove after fix is merged.
    - name: Re-link workspace binaries
      shell: bash
      run: bun install --ignore-scripts

      # Composite-action step `if:` cannot read the `inputs` context — the
      # expression silently evaluates false and the step skips (the likely
      # reason an earlier version of this action abandoned the input for a
      # script). The one condition context proven to work in this action's own
      # history is `steps.*.outputs`, so the input is echoed through a step
      # output — which also logs the received value on every run.
    - name: Resolve browser-install intent
      id: pw
      shell: bash
      env:
        INSTALL_PLAYWRIGHT: ${{ inputs.install-playwright }}
      run: |
        echo "install-playwright input = '${INSTALL_PLAYWRIGHT}'"
        echo "required=${INSTALL_PLAYWRIGHT}" >> "$GITHUB_OUTPUT"

      # Browser binaries are keyed on bun.lock: they only change when the resolved
      # playwright version changes. On a cache hit, `playwright install` skips the
      # download and only the (uncacheable) apt system dependencies are installed.
    - name: Cache Playwright browsers
      if: ${{ steps.pw.outputs.required == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install Playwright browsers
      if: ${{ steps.pw.outputs.required == 'true' }}
      shell: bash
      run: bunx playwright install --with-deps chromium firefox webkit

    - name: Start Nx cache server
      shell: bash
      run: |
        bun ${{ github.action_path }}/nx-cache-server.ts &
        sleep 1
        echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://localhost:9876" >> "$GITHUB_ENV"
        echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=local" >> "$GITHUB_ENV"

    - name: Build packages
      shell: bash
      run: ${{ inputs.build-command }}
