name: Setup environment
description: Installs build tools, restores caches, starts Nx cache server, and installs dependencies
inputs:
  bun-version:
    default: '1.3.9'
    description: Version of Bun to use
  node-version:
    # Node is required for Storybook and Lerna (Bun is used as package manager only)
    # Storybook 10 supports Node 20.16+, 22.19+, or 24+
    default: '24'
    description: Version of Node to use
  build-command:
    default: 'bunx lerna run build:all'
    description: Build command to run. Override with nx affected for PR workflows.
  install-playwright:
    default: 'true'
    description: >-
      Browser tests need browsers; jobs that provably never test (e.g.
      chromatic) opt OUT with 'false'. Browser install is explicit intent, and
      the default is the SAFE side: a previous nx-affected gate silently
      resolved empty in CI (exit 0, no output, nothing logged) while the test
      step still ran the browser suites, so browsers were skipped and every
      browser test died on missing executables (#901). Defaulting 'true' also
      keeps installs correct when a caller workflow executes at a pinned
      (e.g. default-branch) version that predates this input and passes
      nothing. Cost of an unneeded install: ~60-90s, cached on bun.lock.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache node_modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('bun.lock') }}

    - name: Cache Bun global cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Cache Nx remote cache
      uses: actions/cache@v5
      with:
        path: /tmp/nx-remote-cache
        key: nx-remote-cache-${{ runner.os }}-${{ inputs.node-version }}-${{ github.sha }}

    - name: Install dependencies
      shell: bash
      # NOTE: --frozen-lockfile disabled for now due to a known Bun bug where bun install
      # always writes the lockfile internally, causing false positives with --frozen-lockfile
      # even when bun.lock content is unchanged. Tracked in:
      # https://github.com/oven-sh/bun/issues/16692
      # https://github.com/oven-sh/bun/issues/19088
      # run: bun install --frozen-lockfile
      #
      # --ignore-scripts prevents the "prepare" lifecycle hook from triggering a full
      # monorepo build during install. Workflows that need a build invoke it explicitly.
      run: bun install --ignore-scripts && git diff --exit-code bun.lock

      # Workaround for https://github.com/oven-sh/bun/issues/19782
      # Workspace bin symlinks aren't created on first install. Remove after fix is merged.
    - name: Re-link workspace binaries
      shell: bash
      run: bun install --ignore-scripts

      # The browser-install decision lives in SHELL, not in a step `if:`.
      # Step conditions in this composite have now silently mis-evaluated
      # twice on #901 (inputs-context, then a steps-output relay), each time
      # skipping the install with nothing in the log. `${{ inputs.* }}`
      # interpolation into env/run is the one mechanism this file already
      # proves works in CI (build-command, node-version), so the step always
      # runs, always logs the received input, exits 0 when not requested, and
      # self-verifies the executables after installing — a missing browser
      # fails HERE, at the cause, not 200 browser tests later.
      #
      # Browser binaries are keyed on bun.lock: they only change when the
      # resolved playwright version changes. On a cache hit, `playwright
      # install` skips the download and only the (uncacheable) apt system
      # dependencies are installed. The cache step keeps a step `if:` because
      # actions/cache cannot shell-gate; if that condition ever mis-evaluates
      # the way the install conditions did, installs lose the cache but stay
      # correct — the optimization is allowed to break, the install is not.
    - name: Resolve browser-install intent
      id: pw
      shell: bash
      env:
        INSTALL_PLAYWRIGHT: ${{ inputs.install-playwright }}
      run: |
        echo "install-playwright input = '${INSTALL_PLAYWRIGHT}'"
        echo "required=${INSTALL_PLAYWRIGHT}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: ${{ steps.pw.outputs.required == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install Playwright browsers
      shell: bash
      env:
        INSTALL_PLAYWRIGHT: ${{ inputs.install-playwright }}
      run: |
        echo "install-playwright input = '${INSTALL_PLAYWRIGHT}'"
        if [ -z "${INSTALL_PLAYWRIGHT}" ]; then
          echo "::error::install-playwright arrived EMPTY — the input default is 'false', so empty means input propagation into the composite failed"
          exit 1
        fi
        if [ "${INSTALL_PLAYWRIGHT}" != "true" ]; then
          echo "browser install not requested; skipping"
          exit 0
        fi
        # Invoke the WORKSPACE's playwright by path — never `bunx playwright`.
        # When the root bin link is absent (the same first-install bun bug the
        # re-link step above works around), bunx silently falls back to
        # fetching the LATEST playwright from the registry and installs that
        # version's browser builds, which the workspace's pinned
        # playwright-core then cannot find (#901: installed 1234, wanted 1228).
        PW_CLI="node_modules/playwright/cli.js"
        if [ ! -f "$PW_CLI" ]; then
          echo "::error::workspace playwright is not hoisted at ${PW_CLI} — cannot install browsers deterministically"
          exit 1
        fi
        echo "workspace playwright: $(bun "$PW_CLI" --version)"
        bun "$PW_CLI" install --with-deps chromium firefox webkit
        echo "ms-playwright contents after install:"
        ls ~/.cache/ms-playwright/ || true
        # Verify the EXACT revisions the workspace's playwright-core resolves —
        # a version-mismatched install can never again pass setup silently.
        # browsers.json is found THROUGH the playwright package (bun's layout
        # keeps a package's deps beside it), never via a root hoist assumption.
        BROWSERS_JSON="$(dirname "$(realpath "$PW_CLI")")/../playwright-core/browsers.json"
        EXPECTED=$(jq -r '.browsers[] | select(.name=="chromium" or .name=="chromium-headless-shell" or .name=="firefox" or .name=="webkit") | (.name | gsub("-";"_")) + "-" + .revision' "$BROWSERS_JSON")
        missing=0
        for dir in $EXPECTED; do
          [ -d "$HOME/.cache/ms-playwright/$dir" ] || { echo "::error::expected ${dir} in ms-playwright (workspace playwright-core revision)"; missing=1; }
        done
        exit "$missing"

    - name: Start Nx cache server
      shell: bash
      run: |
        bun ${{ github.action_path }}/nx-cache-server.ts &
        sleep 1
        echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://localhost:9876" >> "$GITHUB_ENV"
        echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=local" >> "$GITHUB_ENV"

    - name: Build packages
      shell: bash
      run: ${{ inputs.build-command }}
