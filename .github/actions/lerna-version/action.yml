name: Version packages
description: Updates package version numbers and changelogs for changed packages.
inputs:
  release_type:
    description: "Release type. If not 'stable', the current version will be bumped as a pre-release instead of a stable release."
    required: true
  tag_prefix:
    description: "Prefix for the git tag. Default is 'v'."
    required: false
    default: "v"
  packs_token:
    description: >-
      Token with read access to the declared pack repositories, used only to
      refresh the CLI's embedded pack. Optional: without it the refresh is
      skipped and the release ships the committed snapshot.
    required: false
    default: ""
outputs:
  VERSION:
    description: "The new latest version number across all packages"
    value: ${{ steps.lerna_version.outputs.VERSION }}
runs:
  using: composite
  steps:
    - name: Version packages & generate changelogs
      shell: bash
      id: lerna_version
      run: ${{ github.action_path }}/version.sh ${{ inputs.release_type }} ${{ inputs.tag_prefix }}

      # `lerna version` updates package numbers, so we must update the root lockfile.
      # This can be removed once https://github.com/lerna/lerna/issues/4234 is closed.
    - name: Update lockfile
      shell: bash
      run: bun install --ignore-scripts

      # Lerna may introduce slight formatting changes to the package.json files.
      # This can be removed once https://github.com/lerna/lerna/issues/4117 is closed.
    - name: Apply formatting fixes
      shell: bash
      run: bun run check:fix

      # Regenerate the implementation graph data with the new version so the
      # tagged commit carries ds:version / ds:versionedLink for this release.
    - name: Regenerate implementation graph data
      shell: bash
      run: bun scripts/collect-implementations.ts --version ${{ steps.lerna_version.outputs.VERSION }}

      # Refresh the CLI's embedded pack so the release ships a graph snapshot
      # current with its own tag — a fresh install answers store-backed reads
      # offline, and that answer should not lag the release by weeks. Writes
      # nothing when the resolved upstream inputs are unchanged, so a release
      # with no upstream movement produces no diff.
      #
      # BEST EFFORT, and it says which it did. The pack repositories are
      # INTERNAL and cloned over HTTPS; this job's SSH deploy key is scoped to
      # pragma alone, so without a token that can read them the clone fails —
      # which blocked the entire 0.35.0 release for an artifact that was
      # already committed and already valid. The script skips loudly rather
      # than failing the release, and still fails on a real error once a token
      # is supplied.
    - name: Refresh the CLI embedded pack
      shell: bash
      run: ${{ github.action_path }}/refresh-pack.sh "${{ inputs.packs_token }}"

    - name: Setup Git CLI
      uses: ./.github/actions/setup-git
      with:
        # This param sets the name of the committer to the person who ran the action.
        name: ${{ github.actor }}

    - name: Commit and tag v${{ steps.lerna_version.outputs.VERSION }}
      shell: bash
      run: ${{ github.action_path }}/git-commit.sh ${{ inputs.tag_prefix }}${{ steps.lerna_version.outputs.VERSION }}