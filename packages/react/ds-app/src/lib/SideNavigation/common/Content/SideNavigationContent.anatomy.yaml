---
# SideNavigation.Content — required main navigation region. Grows to fill the
# space between Header and Footer. Renders the direct children of its `root` Item
# (the root itself is a non-rendered container) as content entries — each entry
# is a group (optional header + its navigation items). Data-only: the context
# switcher is NOT a content entry — it is the shell's own region between Header
# and Content, outside this landmark (SPEC.md §1 and the 24.04 spec §4.5).
# See the 24.04 spec §4.3 for the full content vocabulary.
#
# The shell grows past the viewport (min-height), so the page scrolls rather than
# this region: overflow is vertical-only as a safety valve, never horizontal.
node:
  uri: apps.subcomponent.side-navigation-content
  styles:
    layout.type: stack
    layout.direction: column
    layout.flex: 1
    layout.overflow.x: hidden
    layout.overflow.y: auto
    size.width: fill
  edges:
    - node:
        role: content entry
        switch:
          "on": kind
          cases:
            # A group: optional header, plus its navigation items. One of the
            # groups MUST be the mandatory collapsible "Help" item (an
            # ItemExpandable containing at least one external link) — see
            # the 24.04 spec §1.1.
            - node:
                uri: apps.subcomponent.side-navigation-group
                edges:
                  - node:
                      uri: apps.subcomponent.side-navigation-group-header
                    relation:
                      cardinality: "0..1"
                      slotName: header
                  - node:
                      role: navigation item
                      switch:
                        "on": override
                        cases:
                          # Links, plain labels and expandable disclosures
                          # only — interactive action rows are Footer's job
                          # (SPEC.md §1).
                          - uri: apps.subcomponent.side-navigation-item
                          - uri: apps.subcomponent.side-navigation-item-expandable
                          - uri: $custom
                    relation:
                      cardinality: "0..*"
                      slotName: default
      relation:
        cardinality: "0..*"
        slotName: default
