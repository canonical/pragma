---
# SideNavigation.ItemButton — a navigation row that performs an action
# instead of navigating (e.g. "Log out", "Create context"). A Footer-only
# row kind: the content tree accepts links and plain labels, so this row
# lives in a SideNavigation.Footer (rendered from a `control: "button"`
# footer item or composed via the Footer's children).
node:
  uri: apps.subcomponent.side-navigation-item-button
  styles:
    layout.type: stack
    layout.direction: column
    size.width: fill
  edges:
    - node:
        role: row
        styles:
          layout.type: flow
          layout.direction: row
          layout.align: center
          interaction.cursor: pointer
          spacing.padding.vertical: dimension/100
          spacing.gap: dimension/100
          appearance.background: color/foreground/navigation/primary
          typography.text: typography/text/primary
          typography.color: color/text
        edges:
          - node:
              role: icon
              styles:
                appearance.color: color/icon
            relation:
              cardinality: "0..1"
              slotName: icon
          - node:
              role: label
              styles:
                layout.flex: 1
            relation:
              cardinality: "1"
              slotName: label
          - node:
              role: slot
            relation:
              cardinality: "0..1"
              slotName: end
      relation:
        cardinality: "1"
        slotName: default
