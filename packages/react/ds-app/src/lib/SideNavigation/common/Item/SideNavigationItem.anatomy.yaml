---
# SideNavigation.Item — a single, flat, LEAF navigation row rendered from a
# LeafNavItem (the 24.04 spec §4.3). A leaf with `url` renders as a link (via
# LinkComponent); a key-only leaf renders as a non-navigable label. The row
# is NOT recursive and NEVER expandable — an item with `items` (children) is
# an ExpandableNavItem and renders as SideNavigation.ItemExpandable instead
# (a separate subcomponent, disclosure via native <details>/<summary>).
# Interactive action rows are not part of the content vocabulary — they are
# Footer-only (SideNavigation.ItemButton, SPEC.md §1). Identity follows
# getItemId: `url` when present, otherwise `key`.
node:
  uri: apps.subcomponent.side-navigation-item
  styles:
    layout.type: stack
    layout.direction: column
    size.width: fill
  edges:
    # The row: a link (navigable, has url) or a label (key-only). Laid out on the
    # shared SideNavigation row grid — [start] [label] [end] — so the leading
    # icon aligns with the header logo.
    - node:
        # Base + hover/active/disabled per SPEC.md §2 (ADR-T01/T03/T04). The DSL
        # limitation still applies — `appearance.background` expresses one
        # value, but the row needs distinct base/hover/active/disabled; the
        # implementation composes the `--color-foreground-navigation-primary`
        # state suffixes directly in CSS rather than through per-state DSL edges.
        role: row
        styles:
          layout.type: flow
          layout.direction: row
          layout.align: center
          interaction.cursor: pointer
          spacing.padding.vertical: dimension/150
          spacing.gap: dimension/100
          appearance.background: color/foreground/navigation/primary
          typography.text: typography/text/primary
          typography.color: color/text
        edges:
          # Start slot — leading icon. Always reserved (empty when absent) so
          # labels align whether or not a row has an icon.
          - node:
              role: icon
              styles:
                appearance.color: color/icon
            relation:
              cardinality: "0..1"
              slotName: icon
          - node:
              role: label
              styles:
                layout.flex: 1
            relation:
              cardinality: "1"
              slotName: label
          # End slot — the leaf's optional `slot` (e.g. a badge), or nothing.
          # No caret here: disclosure affordance belongs to ItemExpandable.
          - node:
              role: slot
            relation:
              cardinality: "0..1"
              slotName: end
      relation:
        cardinality: "1"
        slotName: default
