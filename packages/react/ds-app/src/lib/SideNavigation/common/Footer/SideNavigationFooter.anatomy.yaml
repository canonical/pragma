---
# SideNavigation.Footer — optional region pinned to the bottom, reserved for
# user-related content. The spec's `footer-items` is a closed 3-item
# vocabulary (account settings, notifications, log out) — the footer is
# hidden entirely when none are selected. `certificateUser` swaps the
# account item's icon (`user` → `certificate`) and forces `logout` out of the
# selection. A free-form `$custom`/root-item escape hatch is retained for
# footers that don't fit the closed vocabulary — see SPEC.md §10.6.
node:
  uri: apps.subcomponent.side-navigation-footer
  styles:
    layout.type: stack
    layout.direction: column
    size.width: fill
  edges:
    - node:
        role: footer item
        switch:
          "on": kind
          cases:
            - role: account
              # Icon is `user`, or `certificate` when `certificateUser` is set.
            - role: notifications
            - role: logout
              # Omitted (not merely hidden) when `certificateUser` is set.
            - uri: $custom
        relation:
          cardinality: "0..3"
          slotName: default
