---
# SideNavigation.Footer — optional region pinned to the bottom, reserved for
# user-related content. Its `footerItems` are free-form — label (required),
# optional icon/url/control/slot — with no closed vocabulary and no default
# labels or icons; a certificate-user application composes the `certificate`
# icon and omits the logout item itself. A free-form `$custom`/root-item
# escape hatch is retained for footers that need a whole WD405 tree.
node:
  uri: apps.subcomponent.side-navigation-footer
  styles:
    layout.type: stack
    layout.direction: column
    size.width: fill
  edges:
    - node:
        role: footer item
        # Navigable items (url set, control not "button") render as links;
        # everything else renders as ItemButton.
        switch:
          "on": control
          cases:
            - role: link
              styles:
                interaction.cursor: pointer
            - role: button
              styles:
                interaction.cursor: pointer
            - uri: $custom
        relation:
          cardinality: "0..*"
          slotName: default
