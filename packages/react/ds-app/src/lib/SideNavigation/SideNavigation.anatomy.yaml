---
# SideNavigation — apps-tier navigation pattern. Self-contained <nav> landmark
# (SPEC.md §1, §6). Full-height vertical shell partitioning its space among
# Header (required), Content (required, grows), and Footer (optional).
# Data-driven: Content and Footer each render a WD405 Item tree.
#
# Secondary navigation (SPEC.md §1.3) is a SIBLING pattern
# (apps.pattern.side-navigation-secondary), not an edge of this node — it is
# an application-shell composition decision (which primary item, if any, is
# currently showing a secondary tree), analogous to how ApplicationLayout
# composes its `navigation` slot. Not modelled here.
#
# The collapsed state (SPEC.md §1.2, §7) suppresses the Content edge entirely
# and repositions the collapse toggle — a runtime/CSS concern the anatomy DSL
# does not currently express (no per-state edge visibility); left as a
# structural note rather than encoded here.
node:
  uri: apps.pattern.side-navigation
  styles:
    layout.type: stack
    layout.direction: column
    size.height: fill
    # Semantic token color.foreground.navigation.primary. Consumed in CSS via
    # its surface CHANNEL (--surface-color-foreground-navigation-primary) so the
    # `.surface` nesting auto-selects layer2/layer3 for nested lists. See ADR-T01.
    appearance.background: color/foreground/navigation/primary
  edges:
    - node:
        uri: apps.subcomponent.side-navigation-header
      relation:
        cardinality: "1"
        slotName: header
    - node:
        uri: apps.subcomponent.side-navigation-content
      relation:
        cardinality: "1"
        slotName: default
    - node:
        uri: apps.subcomponent.side-navigation-footer
      relation:
        cardinality: "0..1"
        slotName: footer
