---
# SideNavigation — apps-tier navigation pattern. The single navigation
# landmark is the Content <nav>; the root is a plain layout container.
# Full-height vertical shell partitioning its space among
# Header (required), Content (required, grows), and Footer (optional).
# Data-driven: Content and Footer each render a WD405 Item tree.
#
# The collapsed state hides the Content edge; footer items degrade to
# icon-only and any rendered ItemExpandable discloses its sub-items into a
# floating popover on the inline-end — a runtime/CSS concern the anatomy DSL
# does not currently express (no per-state edge visibility); left as a
# structural note rather than encoded here.
node:
  uri: apps.pattern.side-navigation
  styles:
    layout.type: stack
    layout.direction: column
    size.height: fill
    # Semantic token color.foreground.navigation.primary. Consumed in CSS via
    # its surface CHANNEL (--surface-color-foreground-navigation-primary) so the
    # `.surface` nesting auto-selects layer2/layer3 for nested lists. See ADR-T01.
    appearance.background: color/foreground/navigation/primary
  edges:
    - node:
        uri: apps.subcomponent.side-navigation-header
      relation:
        cardinality: "1"
        slotName: header
    - node:
        uri: apps.subcomponent.side-navigation-context-switcher
      relation:
        cardinality: "0..1"
        slotName: context-switcher
    - node:
        uri: apps.subcomponent.side-navigation-content
      relation:
        cardinality: "1"
        slotName: default
    - node:
        uri: apps.subcomponent.side-navigation-footer
      relation:
        cardinality: "0..1"
        slotName: footer
